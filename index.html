<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 500px;
            background-color: white;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
        }

        #quote {
            font-size: 22px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        #author {
            font-size: 18px;
            color: #777;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Random Quote Generator</h1>

        <p id="quote">
            Click the button to get a random quote.
        </p>

        <p id="author"></p>

        <button onclick="getQuote()">
            New Quote
        </button>

    </div>


    <script>

        async function getQuote() {

            try {

                const response =
                    await fetch("https://dummyjson.com/quotes/random");

                const data =
                    await response.json();

                document.getElementById("quote").innerText =
                    `"${data.quote}"`;

                document.getElementById("author").innerText =
                    "- " + data.author;

            }

            catch (error) {

                document.getElementById("quote").innerText =
                    "Something went wrong!";

                console.log(error);

            }
        }

    </script>

</body>
</html>
